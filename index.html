<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重疾保障缺口计算器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(20, 35, 60, .08);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 24px; color: #667085; }
    h2 { font-size: 18px; margin: 0 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #667eea; }
    .result {
      display: grid;
      gap: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
    }
    .row:last-child { border-bottom: 0; }
    .total {
      font-size: 18px;
      font-weight: 700;
    }
    .gap {
      margin-top: 18px;
      padding: 20px;
      border-radius: 16px;
      background: #fff4f4;
      border: 1px solid #ffd6d6;
    }
    .gap-label { font-size: 14px; font-weight: 700; }
    .gap-value { font-size: 32px; font-weight: 800; margin-top: 4px; }
    .positive { color: #c62828; }
    .covered { background: #f0fff4; border-color: #c8efd3; }
    .covered .gap-value { color: #16803c; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #172033;
      color: white;
    }
    .note {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 16px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding-top: 16px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>重疾保障缺口计算器</h1>
      <p class="subtitle">用几个数字，估算如果重疾导致暂时无法工作，家庭可能面对的现金缺口。</p>

      <h2>① 收入与责任</h2>
      <div class="grid">
        <div>
          <label for="months">预计不能工作（月）</label>
          <input id="months" type="number" min="1" step="1" value="12">
        </div>
        <div>
          <label for="living">生活费用（衣，食，住，行）（RM）</label>
          <input id="living" type="number" min="0" step="100" value="0">
        </div>
        <div>
          <label for="debt">每月贷款/固定责任（车，屋，贷款）（RM）</label>
          <input id="debt" type="number" min="0" step="100" value="0">
        </div>
        <div>
          <label for="debt">父母生活费（RM）</label>
          <input id="debt" type="number" min="0" step="100" value="0">
        </div>
        <div>
          <label for="debt">孩子教育费（RM）</label>
          <input id="debt" type="number" min="0" step="100" value="0">
        </div>
        <div>
          <label for="debt">额外治疗/康复费用（RM）</label>
          <input id="debt" type="number" min="0" step="100" value="0">
        </div>
      </div>
    </section>

    <section class="card">
      <h2>② 现有资源</h2>
      <div class="grid">
        <div>
          <label for="savings">现有储蓄/紧急备用金（RM）</label>
          <input id="savings" type="number" min="0" step="500" value="0">
        </div>
        <div>
          <label for="ci">现有重疾保障（RM）</label>
          <input id="ci" type="number" min="0" step="5000" value="0">
        </div>
        <div>
          <label for="other">其他可用收入/保障（RM）</label>
          <input id="other" type="number" min="0" step="500" value="0">
        </div>
      </div>
      <p class="note">这是一个教育与讨论工具，不构成保险、医疗或财务建议。实际保障需求应结合个人情况、保单条款及专业建议评估。</p>
    </section>

    <section class="card">
      <h2>③ 计算结果</h2>
      <div class="result">
        <div class="row"><span>收入损失</span><strong id="incomeLoss">RM 0</strong></div>
        <div class="row"><span>家庭生活费 + 固定责任</span><strong id="cashflow">RM 0</strong></div>
        <div class="row"><span>额外治疗/康复费用</span><strong id="extraResult">RM 0</strong></div>
        <div class="row total"><span>预计总现金需求</span><strong id="need">RM 0</strong></div>
        <div class="row"><span>现有储蓄 + 重疾保障 + 其他</span><strong id="available">RM 0</strong></div>
      </div>

      <div id="gapBox" class="gap">
        <div class="gap-label">🔴 预计重疾保障缺口</div>
        <div id="gap" class="gap-value">RM 0</div>
      </div>
    </section>

    <section class="card">
      <button type="button" onclick="resetCalculator()">恢复示例数字</button>
    </section>
  </main>

  <script>
    const ids = ["income","months","living","debt","extra","savings","ci","other"];

    function money(value) {
      return "RM " + Math.round(value).toLocaleString("en-MY");
    }

    function num(id) {
      return Math.max(0, Number(document.getElementById(id).value) || 0);
    }

    function calculate() {
      const incomeLoss = num("income") * num("months");
      const cashflow = (num("living") + num("debt")) * num("months");
      const extra = num("extra");
      const need = incomeLoss + cashflow + extra;

      const available = num("savings") + num("ci") + num("other");
      const gap = Math.max(0, need - available);

      document.getElementById("incomeLoss").textContent = money(incomeLoss);
      document.getElementById("cashflow").textContent = money(cashflow);
      document.getElementById("extraResult").textContent = money(extra);
      document.getElementById("need").textContent = money(need);
      document.getElementById("available").textContent = money(available);
      document.getElementById("gap").textContent = money(gap);

      const box = document.getElementById("gapBox");
      if (gap === 0) {
        box.classList.add("covered");
        box.querySelector(".gap-label").textContent = "🟢 按目前输入，预计现金需求已有覆盖";
      } else {
        box.classList.remove("covered");
        box.querySelector(".gap-label").textContent = "🔴 预计重疾保障缺口";
      }
    }

    function resetCalculator() {
      const defaults = {
        income: 5000, months: 12, living: 0, debt: 0,
        extra: 0, savings: 0, ci: 0, other: 0
      };
      ids.forEach(id => document.getElementById(id).value = defaults[id]);
      calculate();
    }

    ids.forEach(id => document.getElementById(id).addEventListener("input", calculate));
    calculate();
  </script>
</body>
</html>
